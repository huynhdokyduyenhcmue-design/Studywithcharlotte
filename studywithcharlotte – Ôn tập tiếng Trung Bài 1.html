<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>studywithcharlotte – Ôn tập tiếng Trung Bài 1</title>
<style>
:root{--bg:#fdf3f3;--card:#fff;--tx:#2b1d1d;--mut:#7a6666;--pri:#c0393b;--pri2:#f7d9da;--ok:#2e8b57;--no:#d33;--bd:#e8cfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1415;--card:#2a1c1d;--tx:#f5e9e9;--mut:#b9a3a3;--pri:#e5686a;--pri2:#432527;--ok:#58c68a;--no:#ff7b7b;--bd:#4a3032;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{background:var(--pri);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:1.3rem}header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;font-size:.85rem;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:560px;margin:0 auto;padding:8px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:8px}
h2{margin:0 0 4px;font-size:1.1rem}.mut{color:var(--mut);font-size:.88rem}
.fc{height:230px;perspective:900px;margin:14px 0;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;background:var(--pri2);border:2px solid var(--pri)}
.fb{transform:rotateY(180deg)}
.han{font-size:3.4rem;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.py{font-size:1.6rem;color:var(--pri);font-weight:600}.vi{font-size:1.15rem;margin-top:6px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 18px;border-radius:12px;font-size:1rem;cursor:pointer}
.btn.g{background:var(--pri2);color:var(--tx)}
.q{font-size:2.6rem;text-align:center;margin:12px 0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.q.s{font-size:1.6rem}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:12px;border-radius:12px;font-size:1.1rem;cursor:pointer;text-align:center}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 20%,transparent)}
.fb2{min-height:24px;text-align:center;margin:10px 0;font-weight:600}
.bar{height:6px;background:var(--pri2);border-radius:4px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--pri)}
.tok{display:inline-block;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;margin:4px;border-radius:10px;font-size:1.5rem;cursor:pointer;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.ans{min-height:64px;border:2px dashed var(--pri);border-radius:12px;padding:6px;margin:10px 0;text-align:center}
.big{font-size:2.4rem;text-align:center;color:var(--pri);font-weight:700}
</style>
</head>
<body>
<header><h1>studywithcharlotte</h1><p>Ôn tập từ vựng · Bài 1: AI小语，你好！</p></header>
<nav id="nav"></nav>
<main><div id="app"></div></main>
<script>
const V=[["你好","nǐ hǎo","xin chào, chào bạn"],["大家","dàjiā","mọi người"],["好","hǎo","tốt, khoẻ"],["学生","xuésheng","học sinh, sinh viên"],["们","men","hậu tố chỉ số nhiều"],["老师","lǎoshī","thầy giáo, cô giáo"],["您","nín","ngài, ông, bà… (trang trọng)"],["你们","nǐmen","các bạn, các anh, các chị…"],["谢谢","xièxie","cảm ơn"],["不客气","bú kèqi","đừng khách sáo"],["同学","tóngxué","bạn học"],["再见","zàijiàn","tạm biệt"],["王老师","Wáng lǎoshī","cô Vương"]];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app'),nav=document.getElementById('nav');
const T=["1 · Flashcard","2 · Chọn pinyin","3 · Điền từ","4 · Sắp xếp câu","5 · Bộ thủ"];
let cur=0;
T.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>go(i);nav.appendChild(b)});
function go(i){cur=i;[...nav.children].forEach((b,k)=>b.classList.toggle('on',k==i));app.innerHTML='';[flash,quiz2,quiz3,order,quiz5][i]()}
function card(h,sub){const d=document.createElement('div');d.className='card';d.innerHTML=`<h2>${h}</h2><div class="mut">${sub}</div>`;app.appendChild(d);return d}
function flash(){const c=card('Hoạt động 1: Flashcard','Chạm vào thẻ để lật. Mặt trước: chữ Hán · Mặt sau: pinyin + nghĩa.');let L=V.slice(),i=0;
const w=document.createElement('div');c.appendChild(w);
function r(){w.innerHTML=`<div class="fc" id="fc"><div class="fi"><div class="fa"><div class="han">${L[i][0]}</div></div><div class="fb"><div class="py">${L[i][1]}</div><div class="vi">${L[i][2]}</div><button class="btn" id="sp" style="margin-top:14px">🔊 Nghe đọc mẫu</button></div></div></div><div class="mut" style="text-align:center">${i+1} / ${L.length}</div><div class="row" style="margin-top:10px"><button class="btn g" id="p">‹ Trước</button><button class="btn g" id="s">Xáo trộn</button><button class="btn" id="n">Sau ›</button></div>`;
w.querySelector('#fc').onclick=e=>e.currentTarget.classList.toggle('flip');w.querySelector('#sp').onclick=e=>{e.stopPropagation();say(L[i][0])};
w.querySelector('#p').onclick=()=>{i=(i+L.length-1)%L.length;r()};w.querySelector('#n').onclick=()=>{i=(i+1)%L.length;r()};w.querySelector('#s').onclick=()=>{L=sh(L);i=0;r()}}
r()}
function quiz(title,sub,items,cls){const c=card(title,sub);const w=document.createElement('div');c.appendChild(w);let L=sh(items),i=0,sc=0,done=false;
function r(){if(i>=L.length){w.innerHTML=`<div class="big">${sc} / ${L.length}</div><p style="text-align:center">${sc==L.length?'Xuất sắc! 🎉':sc>=L.length*.7?'Tốt lắm! Cố gắng thêm nhé.':'Hãy ôn lại thêm và thử lại nhé!'}</p><div class="row"><button class="btn" id="a">Làm lại</button></div>`;w.querySelector('#a').onclick=()=>{L=sh(items);i=0;sc=0;r()};return}
const it=L[i];done=false;w.innerHTML=`<div class="bar"><i style="width:${i/L.length*100}%"></i></div><div class="mut">Câu ${i+1}/${L.length}</div><div class="q ${cls||''}">${it.q}</div>${it.h?`<div class="mut" style="text-align:center">${it.h}</div>`:''}<div class="opts"></div><div class="fb2"></div><div class="row"></div>`;
const o=w.querySelector('.opts');sh(it.o).forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>{if(done)return;done=true;const ok=x==it.a;if(ok)sc++;b.classList.add(ok?'ok':'no');if(!ok)[...o.children].find(k=>k.textContent==it.a).classList.add('ok');w.querySelector('.fb2').textContent=ok?'✓ Chính xác!':'✗ Đáp án đúng: '+it.a;w.querySelector('.fb2').style.color=ok?'var(--ok)':'var(--no)';if(it.n)w.querySelector('.fb2').innerHTML+=`<div class="mut" style="font-weight:400">${it.n}</div>`;const nb=document.createElement('button');nb.className='btn';nb.textContent=i+1<L.length?'Câu tiếp ›':'Xem kết quả';nb.onclick=()=>{i++;r()};w.querySelector('.row').appendChild(nb)};o.appendChild(b)})}
r()}
function quiz2(){const items=V.map(v=>({q:v[0],h:'Chọn pinyin đúng',a:v[1],o:[v[1],...sh(V.filter(x=>x[1]!=v[1])).slice(0,3).map(x=>x[1])],n:v[2]}));quiz('Hoạt động 2: Chọn pinyin đúng','Nhìn chữ Hán, chọn pinyin chính xác.',items)}
function quiz3(){const S=[["AI小语，___！","你好","AI Tiểu Ngữ, xin chào!",[]],["___好！","大家","Chào mọi người!",["你们"]],["老师，___好！","您","Chào cô ạ! (trang trọng)",[]],["你___好！","们","Chào các bạn!",["你们"]],["王___，你好！","老师","Xin chào cô Vương!",["同学","学生"]],["A：谢谢！ B：___！","不客气","A: Cảm ơn! B: Đừng khách sáo!",[]],["同学们，___！","再见","Tạm biệt các em!",[]],["___们，再见！","同学","Tạm biệt các bạn!",["学生"]],["老师，___！","再见","Tạm biệt cô ạ!",[]],["___！（cảm ơn）","谢谢","Cảm ơn bạn!",[]]];
const P=V.map(v=>v[0]);const items=S.map(s=>({q:s[0].replace('___','＿＿＿'),h:s[2],a:s[1],o:[s[1],...sh(P.filter(x=>x!=s[1]&&!s[3].includes(x)&&!(s[1]=="们"&&x=="你们"))).slice(0,3)]}));quiz('Hoạt động 3: Điền từ vào chỗ trống','Chọn từ thích hợp để hoàn thành câu.',items,'s')}
function order(){const c=card('Hoạt động 4: Sắp xếp câu','Chạm vào các từ theo đúng thứ tự để tạo thành câu.');const S=[[["同学们","，","再见","！"],"Tạm biệt các em!"],[["老师","，","您","好","！"],"Chào cô ạ!"],[["你们","好","！"],"Chào các bạn!"],[["王老师","，","你好","！"],"Xin chào cô Vương!"],[["你好","，","小语","！"],"Xin chào, Tiểu Ngữ!"],[["大家","好","！"],"Chào mọi người!"],[["老师","，","再见","！"],"Tạm biệt cô ạ!"],[["同学们","，","你们","好","！"],"Chào các em!"]];
const w=document.createElement('div');c.appendChild(w);let L=sh(S),i=0,sc=0;
function r(){if(i>=L.length){w.innerHTML=`<div class="big">${sc} / ${L.length}</div><div class="row"><button class="btn" id="a">Làm lại</button></div>`;w.querySelector('#a').onclick=()=>{L=sh(S);i=0;sc=0;r()};return}
const [t,vi]=L[i];let pick=[],used=[],tries=0;
w.innerHTML=`<div class="mut">Câu ${i+1}/${L.length}</div><div class="q s">${vi}</div><div class="ans" id="ans"></div><div style="text-align:center" id="pool"></div><div class="fb2"></div><div class="row"><button class="btn g" id="rs">Xoá</button><button class="btn" id="ck">Kiểm tra</button></div>`;
const ans=w.querySelector('#ans'),pool=w.querySelector('#pool'),fb=w.querySelector('.fb2');
function d(){ans.innerHTML=pick.map(k=>`<span class="tok">${t[k]}</span>`).join('');pool.innerHTML='';sh(t.map((_,k)=>k)).forEach(k=>{});
t.map((x,k)=>k).sort((a,b)=>order_[a]-order_[b]).forEach(k=>{if(pick.includes(k))return;const b=document.createElement('button');b.className='tok';b.textContent=t[k];b.onclick=()=>{pick.push(k);d()};pool.appendChild(b)})}
const order_=sh(t.map((_,k)=>k));
const ord={};order_.forEach((v,p)=>ord[v]=p);Object.keys(ord).forEach(k=>order_[k]=ord[k]);
w.querySelector('#rs').onclick=()=>{pick=[];fb.textContent='';d()};
let fin=false;
w.querySelector('#ck').onclick=()=>{if(fin)return;const s=pick.map(k=>t[k]).join(''),ok=s==t.join('');if(pick.length<t.length){fb.textContent='Hãy dùng hết các từ nhé.';fb.style.color='var(--mut)';return}
if(ok){fin=true;if(!tries)sc++;fb.textContent='✓ Chính xác! '+t.join('');fb.style.color='var(--ok)';const nb=document.createElement('button');nb.className='btn';nb.textContent='Câu tiếp ›';nb.onclick=()=>{i++;r()};w.querySelector('.row').appendChild(nb)}else{tries++;fb.textContent='✗ Chưa đúng, thử lại nhé!';fb.style.color='var(--no)'}};
d()}
r()}
function quiz5(){const R=["亻","女","讠","耂","宀","心","氵","木","口","扌","日","火"];
const D=[["你","？尔","亻","nǐ – bạn"],["好","？子","女","hǎo – tốt"],["们","？门","亻","men – hậu tố số nhiều"],["谢","？射","讠","xiè – cảm ơn"],["老","？匕","耂","lǎo – già, cũ"],["客","？各","宀","kè – khách"],["您","你＋？","心","nín – ngài, ông, bà"],["家","？豕","宀","jiā – nhà"]];
const items=D.map(d=>({q:d[1],h:'Chữ Hán này đang thiếu bộ thủ nào?',a:d[2],o:[d[2],...sh(R.filter(x=>x!=d[2])).slice(0,3)],n:`Chữ hoàn chỉnh: <b style="font-size:1.4rem">${d[0]}</b> (${d[3]})`}));quiz('Hoạt động 5: Bộ thủ bị mất','Chọn bộ thủ còn thiếu của chữ Hán.',items)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function quiz5(){const R=[["亻","người (nhân đứng)"],["彳","bước chân (xích)"],["女","phụ nữ (nữ)"],["子","con (tử)"],["讠","lời nói (ngôn)"],["氵","nước (thủy)"],["耂","người già (lão)"],["扌","bàn tay (thủ)"],["木","cây (mộc)"],["宀","mái nhà (miên)"],["冖","cái khăn trùm (mịch)"],["心","trái tim (tâm)"],["忄","tim đứng (tâm đứng)"],["口","cái miệng (khẩu)"]];
const lab=c=>c+'  '+R.find(r=>r[0]==c)[1];
const f='font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif"';
const svg=(rest,pos)=>{let b,t;if(pos=='l'){b=[18,28,100,184];t=[172,150]}else if(pos=='r'){b=[122,28,100,184];t=[68,150]}else if(pos=='t'){b=[28,18,184,100];t=[120,198]}else{b=[28,122,184,100];t=[120,100]}
const qx=b[0]+b[2]/2,qy=b[1]+b[3]/2+20;
return `<svg viewBox="0 0 240 240" width="220" height="220" style="display:block;margin:auto" role="img" aria-label="Chữ Hán thiếu bộ thủ"><rect x="2" y="2" width="236" height="236" rx="18" fill="var(--pri2)" stroke="var(--pri)" stroke-width="2"/><rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="12" fill="var(--card)" stroke="var(--pri)" stroke-width="3" stroke-dasharray="8 6"/><text x="${qx}" y="${qy}" text-anchor="middle" font-size="64" fill="var(--pri)" ${f}>？</text><text x="${t[0]}" y="${t[1]}" text-anchor="middle" font-size="90" fill="var(--tx)" ${f}>${rest}</text></svg>`};
const D=[["你","尔","l","亻","bạn","彳"],["好","子","l","女","tốt, khoẻ","子"],["们","门","l","亻","hậu tố số nhiều","彳"],["谢","射","l","讠","cảm ơn","氵"],["老","匕","t","耂","già, cũ","扌"],["客","各","t","宀","khách","冖"],["您","你","b","心","ngài (trang trọng)","忄"],["家","豕","t","宀","nhà","冖"]];
const all=R.map(r=>r[0]);
const items=D.map(d=>({q:svg(d[1],d[2]),h:`Chữ hoàn chỉnh có nghĩa: “${d[4]}”. Ô nét đứt đang thiếu bộ thủ nào?`,a:lab(d[3]),o:[lab(d[3]),lab(d[5]),...sh(all.filter(x=>x!=d[3]&&x!=d[5])).slice(0,2).map(lab)],n:`Chữ hoàn chỉnh: <b style="font-size:1.6rem">${d[0]}</b> (${d[4]})`}));
quiz('Hoạt động 5: Bộ thủ bị mất','Nhìn hình, chọn bộ thủ còn thiếu. Mỗi bộ thủ có kèm nghĩa để tránh nhầm các nét giống nhau.',items)}
go(0)
</script>
</body>
</html>
